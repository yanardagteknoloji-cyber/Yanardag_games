<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --neutral-bg: #E8EDF8;  --neutral-fg: #1A2242;
    --yes-bg:     #1F8A4C;  --yes-fg:     #FFFFFF;
    --yesx-bg:    #12683A;  --yesx-fg:    #FFFFFF;
    --no-bg:      #C93630;  --no-fg:      #FFFFFF;
    --nox-bg:     #94202B;  --nox-fg:     #FFFFFF;
    --maybe-bg:   #F2B01E;  --maybe-fg:   #2A1C00;

    --bg: var(--neutral-bg);
    --fg: var(--neutral-fg);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --neutral-bg: #12172B;  --neutral-fg: #EEF1FA;
      --yes-bg:     #1B7A44;  --yes-fg:     #FFFFFF;
      --yesx-bg:    #0F5A2E;  --yesx-fg:    #FFFFFF;
      --no-bg:      #B32E2A;  --no-fg:      #FFFFFF;
      --nox-bg:     #7E1824;  --nox-fg:     #FFFFFF;
      --maybe-bg:   #D6940A;  --maybe-fg:   #1F1400;
    }
  }

  :root[data-theme="dark"] {
    --neutral-bg: #12172B;  --neutral-fg: #EEF1FA;
    --yes-bg:     #1B7A44;  --yes-fg:     #FFFFFF;
    --yesx-bg:    #0F5A2E;  --yesx-fg:    #FFFFFF;
    --no-bg:      #B32E2A;  --no-fg:      #FFFFFF;
    --nox-bg:     #7E1824;  --nox-fg:     #FFFFFF;
    --maybe-bg:   #D6940A;  --maybe-fg:   #1F1400;
  }

  :root[data-tone="yes"]   { --bg: var(--yes-bg);   --fg: var(--yes-fg); }
  :root[data-tone="yesx"]  { --bg: var(--yesx-bg);  --fg: var(--yesx-fg); }
  :root[data-tone="no"]    { --bg: var(--no-bg);    --fg: var(--no-fg); }
  :root[data-tone="nox"]   { --bg: var(--nox-bg);   --fg: var(--nox-fg); }
  :root[data-tone="maybe"] { --bg: var(--maybe-bg); --fg: var(--maybe-fg); }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    transition: background-color .35s ease, color .35s ease;
  }

  body {
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-optical-sizing: auto;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2rem, 7vh, 3.5rem);
    padding: 1.5rem;
    box-sizing: border-box;
    text-align: center;
  }

  .answer {
    margin: 0;
    max-width: 14ch;
    min-height: 2.04em;
    display: grid;
    place-items: center;
    font-size: clamp(2.75rem, 13vw, 7rem);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.025em;
    text-wrap: balance;
    overflow-wrap: anywhere;
    transition: opacity .12s ease;
  }
  .answer.rolling { opacity: .45; }
  .answer.pop { animation: pop .3s cubic-bezier(.2, 1.4, .4, 1); }

  @keyframes pop {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .go {
    font: inherit;
    font-weight: 700;
    font-size: clamp(1.15rem, 4.5vw, 1.5rem);
    padding: 1.05rem 2.6rem;
    border: 0;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    cursor: pointer;
    transition: transform .12s ease, background-color .35s ease, color .35s ease;
  }
  .go:active { transform: scale(.96); }
  .go[aria-disabled="true"] { cursor: default; }
  .go:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    html, body, .go, .answer { transition: none; }
    .answer.pop { animation: none; }
  }
</style>
</head>

  var all  = sides[0].concat(sides[1], sides[2]);
  var last = null;

  var root   = document.documentElement;
  var answer = document.getElementById("answer");
  var btn    = document.getElementById("go");
  var live   = document.getElementById("live");
  var busy   = false;

  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function rand(n) { return Math.floor(Math.random() * n); }

  function pick() {
    var item;
    do {
      var side = sides[rand(sides.length)];
      item = side[rand(side.length)];
    } while (item === last);
    last = item;
    return item;
  }

  function land(item) {
    answer.classList.remove("rolling", "pop");
    answer.textContent = item.t;
    root.setAttribute("data-tone", item.tone);
    void answer.offsetWidth;
    answer.classList.add("pop");
    live.textContent = item.t;
    btn.textContent = "Tekrar sor";
    btn.setAttribute("aria-disabled", "false");
    busy = false;
  }

  function roll() {
    if (busy) return;
    busy = true;
    btn.setAttribute("aria-disabled", "true");

    var final = pick();

    if (reduceMotion) { land(final); return; }

    root.removeAttribute("data-tone");
    btn.textContent = "Düşünüyorum…";
    answer.classList.remove("pop");
    answer.classList.add("rolling");

    var steps = 12, i = 0;
    (function tick() {
      if (i >= steps) { land(final); return; }
      answer.textContent = all[rand(all.length)].t;
      i += 1;
      setTimeout(tick, 60 + i * 12);
    })();
  }

  btn.addEventListener("click", roll);
</script>
