<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red vs Blue Tic Tac Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.5s ease;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .grid-cell {
            border: 3px solid #333;
            height: 100px;
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        @media (max-width: 640px) {
            .grid-cell {
                height: 80px;
                width: 80px;
                font-size: 2rem;
            }
        }
        
        @media (max-width: 400px) {
            .grid-cell {
                height: 70px;
                width: 70px;
                font-size: 1.8rem;
                border-width: 2px;
            }
        }
        
        .grid-cell:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .btn {
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn.active {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .player-x {
            color: #e53e3e; /* Red */
        }
        
        .player-o {
            color: #3182ce; /* Blue */
        }
        
        .win-animation {
            animation: winPulse 1s infinite alternate;
        }
        
        @keyframes winPulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        
        .score-card {
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .welcome-screen, .victory-screen, .difficulty-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .victory-screen {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        .victory-screen.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .welcome-card, .victory-card, .difficulty-card {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            width: 500px;
        }
        
        .bg-red-theme {
            background-color: #b91c1c; /* Darker red */
        }
        
        .bg-blue-theme {
            background-color: #1e40af; /* Darker blue */
        }
        
        /* Slider styling */
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(to right, #4ade80, #facc15, #ef4444);
            outline: none;
            margin: 20px 0;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #333;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #333;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .creator-credit {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
            padding: 5px 10px;
            border-radius: 15px;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .creator-credit:hover {
            color: white;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .fullscreen-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .fullscreen-btn:hover {
            background-color: rgba(0, 0, 0, 0.5);
            transform: scale(1.1);
        }
        
        .fullscreen-btn svg {
            width: 20px;
            height: 20px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 1rem;
        }
        
        /* Responsive adjustments */
        @media (max-height: 700px) {
            .game-container {
                padding: 0.5rem;
            }
            
            .game-board {
                transform: scale(0.9);
                transform-origin: center center;
            }
        }
        
        @media (max-height: 600px) {
            .game-board {
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body class="bg-red-theme">
    <!-- Fullscreen Button -->
    <button id="fullscreenBtn" class="fullscreen-btn" title="Toggle Fullscreen">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5-5" />
        </svg>
    </button>

    <!-- Welcome Screen -->
    <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-card text-center">
            <h2 class="text-3xl font-bold mb-6">Welcome to Tic Tac Toe!</h2>
            <p class="mb-8 text-gray-600">Choose your game mode to start playing</p>
            <div class="flex justify-center gap-4 flex-wrap">
                <button id="welcomeBotBtn" class="btn bg-gray-800 text-white px-8 py-4 text-xl">Play vs Bot</button>
                <button id="welcomeFriendBtn" class="btn bg-gray-800 text-white px-8 py-4 text-xl">Play vs Friend</button>
            </div>
        </div>
    </div>
    
    <!-- Difficulty Selection Screen -->
    <div id="difficultyScreen" class="difficulty-screen" style="display: none;">
        <div class="difficulty-card text-center">
            <h2 class="text-3xl font-bold mb-6">Select Difficulty</h2>
            <div class="mb-8">
                <div class="flex justify-between mb-2">
                    <span class="text-green-500 font-semibold">Easy</span>
                    <span class="text-yellow-500 font-semibold">Medium</span>
                    <span class="text-red-500 font-semibold">Hard</span>
                </div>
                <input type="range" min="1" max="3" value="1" class="slider" id="difficultySlider">
                <p id="difficultyValue" class="mt-4 text-xl font-bold text-green-500">Easy</p>
            </div>
            <button id="startGameBtn" class="btn bg-gray-800 text-white px-8 py-4 text-xl">Start Game</button>
        </div>
    </div>
    
    <!-- Victory Screen -->
    <div id="victoryScreen" class="victory-screen">
        <div class="victory-card text-center">
            <h2 id="victoryTitle" class="text-3xl font-bold mb-4">RED WINS!</h2>
            <div id="victoryMessage" class="mb-8 text-xl">Congratulations!</div>
            <div class="flex justify-center gap-4 flex-wrap">
                <button id="playAgainBtn" class="btn bg-green-600 text-white px-6 py-3">Play Again</button>
                <button id="changeModeBtn" class="btn bg-gray-800 text-white px-6 py-3">Change Mode</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <!-- New Game Button (Top Right) -->
        <div class="fixed top-4 right-4">
            <button id="newGameBtn" class="btn bg-gray-800 text-white">New Game</button>
        </div>

        <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg game-board">
            <h1 class="text-3xl md:text-4xl font-bold mb-4 text-center">Tic Tac Toe</h1>
            <p class="text-center mb-6 text-gray-600">Red vs Blue</p>
            
            <div id="gameInfo" class="mb-6 text-center">
                <div id="gameModeDisplay" class="text-lg font-semibold mb-2">Game Mode: vs Bot (Easy)</div>
            </div>
            
            <div id="statusDisplay" class="mb-4 text-xl font-bold text-center h-8 player-x">RED'S TURN</div>
            
            <div class="grid grid-cols-3 gap-2 mb-6 mx-auto" style="max-width: 320px;">
                <div class="grid-cell" data-cell-index="0"></div>
                <div class="grid-cell" data-cell-index="1"></div>
                <div class="grid-cell" data-cell-index="2"></div>
                <div class="grid-cell" data-cell-index="3"></div>
                <div class="grid-cell" data-cell-index="4"></div>
                <div class="grid-cell" data-cell-index="5"></div>
                <div class="grid-cell" data-cell-index="6"></div>
                <div class="grid-cell" data-cell-index="7"></div>
                <div class="grid-cell" data-cell-index="8"></div>
            </div>
            
            <div class="flex justify-between items-center flex-wrap gap-2">
                <button id="restartBtn" class="btn bg-gray-800 text-white">Restart Game</button>
                <div class="flex gap-4">
                    <div class="score-card bg-red-100">
                        <span class="text-sm font-semibold text-red-600">Red:</span>
                        <span id="scoreX" class="font-bold text-red-600">0</span>
                    </div>
                    <div class="score-card bg-blue-100">
                        <span class="text-sm font-semibold text-blue-600">Blue:</span>
                        <span id="scoreO" class="font-bold text-blue-600">0</span>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 text-sm text-gray-600 bg-gray-100 p-3 rounded-lg">
                <p id="consoleOutput">Game initialized. Red starts the game.</p>
            </div>
        </div>
    </div>
    
    <!-- Creator Credit -->
    <div class="creator-credit">yanardağ tarafından yapıldı</div>

    <script>
        // Game elements
        const statusDisplay = document.getElementById('statusDisplay');
        const gameBoard = document.querySelectorAll('.grid-cell');
        const restartBtn = document.getElementById('restartBtn');
        const scoreX = document.getElementById('scoreX');
        const scoreO = document.getElementById('scoreO');
        const consoleOutput = document.getElementById('consoleOutput');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const welcomeBotBtn = document.getElementById('welcomeBotBtn');
        const welcomeFriendBtn = document.getElementById('welcomeFriendBtn');
        const difficultyScreen = document.getElementById('difficultyScreen');
        const difficultySlider = document.getElementById('difficultySlider');
        const difficultyValue = document.getElementById('difficultyValue');
        const startGameBtn = document.getElementById('startGameBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const victoryScreen = document.getElementById('victoryScreen');
        const victoryTitle = document.getElementById('victoryTitle');
        const victoryMessage = document.getElementById('victoryMessage');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const changeModeBtn = document.getElementById('changeModeBtn');
        const gameModeDisplay = document.getElementById('gameModeDisplay');
        const creatorCredit = document.querySelector('.creator-credit');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        // Game variables
        let gameActive = true;
        let currentPlayer = "X"; // X is Red, O is Blue
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let scores = { X: 0, O: 0 };
        let gameMode = "bot";
        let difficulty = "easy";
        let moveCount = 0; // Track number of moves for advanced strategy
        let isFullscreen = false;
        
        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];
        
        // Fullscreen functions
        function openFullscreen() {
            const elem = document.documentElement;
            
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
            
            isFullscreen = true;
            updateFullscreenButton();
        }
        
        function closeFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
            }
            
            isFullscreen = false;
            updateFullscreenButton();
        }
        
        function toggleFullscreen() {
            if (!isFullscreen) {
                openFullscreen();
            } else {
                closeFullscreen();
            }
        }
        
        function updateFullscreenButton() {
            if (isFullscreen) {
                fullscreenBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>`;
            } else {
                fullscreenBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5-5" />
                </svg>`;
            }
        }
        
        function updateConsole(message) {
            consoleOutput.textContent = message;
        }
        
        function handleCellClick(clickedCellEvent) {
            const clickedCell = clickedCellEvent.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-cell-index'));
            
            if (gameState[clickedCellIndex] !== "" || !gameActive) {
                return;
            }
            
            handleCellPlayed(clickedCell, clickedCellIndex);
            moveCount++;
            handleResultValidation();
            
            if (gameActive && gameMode === "bot" && currentPlayer === "O") {
                setTimeout(() => {
                    makeBotMove();
                }, 700);
            }
        }
        
        function handleCellPlayed(clickedCell, clickedCellIndex) {
            gameState[clickedCellIndex] = currentPlayer;
            
            if (currentPlayer === "X") {
                clickedCell.textContent = "X";
                clickedCell.classList.add("player-x");
                updateConsole(`Red marked position ${clickedCellIndex + 1}`);
            } else {
                clickedCell.textContent = "O";
                clickedCell.classList.add("player-o");
                updateConsole(`Blue marked position ${clickedCellIndex + 1}`);
            }
        }
        
        function handlePlayerChange() {
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            
            if (currentPlayer === "X") {
                statusDisplay.textContent = "RED'S TURN";
                statusDisplay.classList.remove("player-o");
                statusDisplay.classList.add("player-x");
                document.body.classList.remove("bg-blue-theme");
                document.body.classList.add("bg-red-theme");
            } else {
                statusDisplay.textContent = "BLUE'S TURN";
                statusDisplay.classList.remove("player-x");
                statusDisplay.classList.add("player-o");
                document.body.classList.remove("bg-red-theme");
                document.body.classList.add("bg-blue-theme");
            }
        }
        
        function showVictoryScreen(winner) {
            if (winner === "X") {
                victoryTitle.textContent = "RED WINS!";
                victoryTitle.className = "text-3xl font-bold mb-4 player-x";
                victoryMessage.textContent = "Congratulations to Red player!";
            } else if (winner === "O") {
                victoryTitle.textContent = "BLUE WINS!";
                victoryTitle.className = "text-3xl font-bold mb-4 player-o";
                victoryMessage.textContent = "Congratulations to Blue player!";
            } else {
                victoryTitle.textContent = "DRAW!";
                victoryTitle.className = "text-3xl font-bold mb-4";
                victoryMessage.textContent = "The game ended in a draw!";
            }
            
            setTimeout(() => {
                victoryScreen.classList.add("show");
            }, 500);
        }
        
        function handleResultValidation() {
            let roundWon = false;
            let winningLine = null;
            
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    winningLine = [a, b, c];
                    break;
                }
            }
            
            if (roundWon) {
                if (currentPlayer === "X") {
                    statusDisplay.textContent = "RED WINS!";
                    statusDisplay.classList.add("player-x");
                    statusDisplay.classList.remove("player-o");
                    updateConsole("Red has won the game!");
                    document.body.classList.remove("bg-blue-theme");
                    document.body.classList.add("bg-red-theme");
                } else {
                    statusDisplay.textContent = "BLUE WINS!";
                    statusDisplay.classList.add("player-o");
                    statusDisplay.classList.remove("player-x");
                    updateConsole("Blue has won the game!");
                    document.body.classList.remove("bg-red-theme");
                    document.body.classList.add("bg-blue-theme");
                }
                
                // Highlight winning cells
                if (winningLine) {
                    winningLine.forEach(index => {
                        const cell = document.querySelector(`[data-cell-index="${index}"]`);
                        cell.classList.add("win-animation");
                    });
                }
                
                gameActive = false;
                scores[currentPlayer]++;
                updateScores();
                showVictoryScreen(currentPlayer);
                return;
            }
            
            const roundDraw = !gameState.includes("");
            if (roundDraw) {
                statusDisplay.textContent = "DRAW!";
                statusDisplay.classList.remove("player-x", "player-o");
                gameActive = false;
                updateConsole("Game ended in a draw");
                showVictoryScreen("draw");
                return;
            }
            
            handlePlayerChange();
        }
        
        function updateScores() {
            scoreX.textContent = scores.X;
            scoreO.textContent = scores.O;
        }
        
        function restartGame() {
            gameActive = true;
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            moveCount = 0;
            
            statusDisplay.textContent = "RED'S TURN";
            statusDisplay.classList.add("player-x");
            statusDisplay.classList.remove("player-o");
            document.body.classList.remove("bg-blue-theme");
            document.body.classList.add("bg-red-theme");
            
            gameBoard.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove("player-x", "player-o", "win-animation");
            });
            
            updateConsole("Game restarted. Red starts.");
            victoryScreen.classList.remove("show");
        }
        
        function newGame() {
            scores = { X: 0, O: 0 };
            updateScores();
            restartGame();
            welcomeScreen.style.display = "flex";
            victoryScreen.classList.remove("show");
        }
        
        function makeBotMove() {
            if (!gameActive) return;
            
            let index;
            
            switch (difficulty) {
                case "easy":
                    index = makeEasyMove();
                    break;
                case "medium":
                    index = makeMediumMove();
                    break;
                case "hard":
                    index = makeSmartMove();
                    break;
                default:
                    index = makeEasyMove();
            }
            
            const cell = document.querySelector(`[data-cell-index="${index}"]`);
            handleCellPlayed(cell, index);
            moveCount++;
            handleResultValidation();
        }
        
        function makeEasyMove() {
            // Random empty cell
            const emptyCells = gameState.map((cell, index) => cell === "" ? index : null).filter(index => index !== null);
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }
        
        function makeMediumMove() {
            // 70% chance of making a smart move, 30% random
            if (Math.random() < 0.7) {
                return makeHardMove();
            } else {
                return makeEasyMove();
            }
        }
        
        function makeHardMove() {
            // First check if bot can win
            for (let i = 0; i < gameState.length; i++) {
                if (gameState[i] === "") {
                    gameState[i] = "O";
                    for (let j = 0; j < winningConditions.length; j++) {
                        const [a, b, c] = winningConditions[j];
                        if (gameState[a] === "O" && gameState[b] === "O" && gameState[c] === "O") {
                            gameState[i] = "";
                            return i;
                        }
                    }
                    gameState[i] = "";
                }
            }
            
            // Then check if player can win and block
            for (let i = 0; i < gameState.length; i++) {
                if (gameState[i] === "") {
                    gameState[i] = "X";
                    for (let j = 0; j < winningConditions.length; j++) {
                        const [a, b, c] = winningConditions[j];
                        if (gameState[a] === "X" && gameState[b] === "X" && gameState[c] === "X") {
                            gameState[i] = "";
                            return i;
                        }
                    }
                    gameState[i] = "";
                }
            }
            
            // Take center if available
            if (gameState[4] === "") {
                return 4;
            }
            
            // Take corners if available
            const corners = [0, 2, 6, 8].filter(index => gameState[index] === "");
            if (corners.length > 0) {
                return corners[Math.floor(Math.random() * corners.length)];
            }
            
            // Take any available edge
            const edges = [1, 3, 5, 7].filter(index => gameState[index] === "");
            if (edges.length > 0) {
                return edges[Math.floor(Math.random() * edges.length)];
            }
            
            // Fallback to random move
            return makeEasyMove();
        }
        
        // Enhanced AI for hard difficulty
        function makeSmartMove() {
            // First move strategy
            if (moveCount === 1) {
                // If player took center, take a corner
                if (gameState[4] === "X") {
                    const corners = [0, 2, 6, 8];
                    return corners[Math.floor(Math.random() * corners.length)];
                }
                // If player took a corner, take center
                else if (gameState[0] === "X" || gameState[2] === "X" || gameState[6] === "X" || gameState[8] === "X") {
                    return 4;
                }
                // If player took an edge, take center
                else {
                    return 4;
                }
            }
            
            // Check for winning move
            const winMove = findWinningMove("O");
            if (winMove !== -1) return winMove;
            
            // Check for blocking move
            const blockMove = findWinningMove("X");
            if (blockMove !== -1) return blockMove;
            
            // Check for fork opportunity (creating two winning ways)
            const forkMove = findForkMove("O");
            if (forkMove !== -1) return forkMove;
            
            // Block opponent's fork
            const blockForkMove = findForkMove("X");
            if (blockForkMove !== -1) return blockForkMove;
            
            // Center strategy
            if (gameState[4] === "") return 4;
            
            // Opposite corner strategy
            const oppositeCornerMove = findOppositeCorner();
            if (oppositeCornerMove !== -1) return oppositeCornerMove;
            
            // Empty corner strategy
            const cornerMove = findEmptyCorner();
            if (cornerMove !== -1) return cornerMove;
            
            // Empty edge strategy
            const edgeMove = findEmptyEdge();
            if (edgeMove !== -1) return edgeMove;
            
            // Fallback to random move
            return makeEasyMove();
        }
        
        function findWinningMove(player) {
            for (let i = 0; i < gameState.length; i++) {
                if (gameState[i] === "") {
                    gameState[i] = player;
                    let isWinning = false;
                    
                    for (let j = 0; j < winningConditions.length; j++) {
                        const [a, b, c] = winningConditions[j];
                        if (gameState[a] === player && gameState[b] === player && gameState[c] === player) {
                            isWinning = true;
                            break;
                        }
                    }
                    
                    gameState[i] = "";
                    if (isWinning) return i;
                }
            }
            return -1;
        }
        
        function findForkMove(player) {
            for (let i = 0; i < gameState.length; i++) {
                if (gameState[i] === "") {
                    gameState[i] = player;
                    let winningWays = 0;
                    
                    for (let j = 0; j < winningConditions.length; j++) {
                        const [a, b, c] = winningConditions[j];
                        
                        // Count potential winning ways
                        const playerCount = [gameState[a], gameState[b], gameState[c]].filter(cell => cell === player).length;
                        const emptyCount = [gameState[a], gameState[b], gameState[c]].filter(cell => cell === "").length;
                        
                        if (playerCount === 2 && emptyCount === 1) {
                            winningWays++;
                        }
                    }
                    
                    gameState[i] = "";
                    if (winningWays >= 2) return i;
                }
            }
            
            // Special case: if player has opposite corners and we have center, take an edge
            if (player === "X" && gameState[4] === "O" && 
                ((gameState[0] === "X" && gameState[8] === "X") || 
                 (gameState[2] === "X" && gameState[6] === "X"))) {
                const edges = [1, 3, 5, 7].filter(idx => gameState[idx] === "");
                if (edges.length > 0) return edges[0];
            }
            
            return -1;
        }
        
        function findOppositeCorner() {
            const oppositeCorners = [[0, 8], [2, 6]];
            
            for (const [corner1, corner2] of oppositeCorners) {
                if (gameState[corner1] === "X" && gameState[corner2] === "") return corner2;
                if (gameState[corner2] === "X" && gameState[corner1] === "") return corner1;
            }
            
            return -1;
        }
        
        function findEmptyCorner() {
            const corners = [0, 2, 6, 8].filter(idx => gameState[idx] === "");
            if (corners.length > 0) return corners[0];
            return -1;
        }
        
        function findEmptyEdge() {
            const edges = [1, 3, 5, 7].filter(idx => gameState[idx] === "");
            if (edges.length > 0) return edges[0];
            return -1;
        }
        
        function setGameMode(mode) {
            gameMode = mode;
            
            if (mode === "bot") {
                // Show difficulty screen for bot mode
                welcomeScreen.style.display = "none";
                difficultyScreen.style.display = "flex";
            } else {
                // Start game directly for friend mode
                welcomeScreen.style.display = "none";
                gameModeDisplay.textContent = "Game Mode: vs Friend";
                updateConsole("Game mode set to Friend");
                restartGame();
                openFullscreen();
            }
        }
        
        function setDifficulty() {
            const value = difficultySlider.value;
            
            if (value == 1) {
                difficulty = "easy";
                difficultyValue.textContent = "Easy";
                difficultyValue.className = "mt-4 text-xl font-bold text-green-500";
            } else if (value == 2) {
                difficulty = "medium";
                difficultyValue.textContent = "Medium";
                difficultyValue.className = "mt-4 text-xl font-bold text-yellow-500";
            } else {
                difficulty = "hard";
                difficultyValue.textContent = "Hard";
                difficultyValue.className = "mt-4 text-xl font-bold text-red-500";
            }
        }
        
        function startGame() {
            difficultyScreen.style.display = "none";
            gameModeDisplay.textContent = `Game Mode: vs Bot (${difficulty.charAt(0).toUpperCase() + difficulty.slice(1)})`;
            updateConsole(`Game mode set to Bot (${difficulty})`);
            restartGame();
            openFullscreen();
        }
        
        // Welcome screen handlers
        function handleWelcomeBotClick() {
            setGameMode("bot");
        }
        
        function handleWelcomeFriendClick() {
            setGameMode("friend");
        }
        
        // Event listeners
        gameBoard.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', restartGame);
        welcomeBotBtn.addEventListener('click', handleWelcomeBotClick);
        welcomeFriendBtn.addEventListener('click', handleWelcomeFriendClick);
        difficultySlider.addEventListener('input', setDifficulty);
        startGameBtn.addEventListener('click', startGame);
        newGameBtn.addEventListener('click', newGame);
        playAgainBtn.addEventListener('click', restartGame);
        changeModeBtn.addEventListener('click', newGame);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Initialize with red background and set initial difficulty
        document.body.classList.add("bg-red-theme");
        setDifficulty();
        updateFullscreenButton();
        
        // Handle fullscreen change events
        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            updateFullscreenButton();
        });
        
        document.addEventListener('webkitfullscreenchange', () => {
            isFullscreen = !!document.webkitFullscreenElement;
            updateFullscreenButton();
        });
        
        document.addEventListener('mozfullscreenchange', () => {
            isFullscreen = !!document.mozFullScreenElement;
            updateFullscreenButton();
        });
        
        document.addEventListener('MSFullscreenChange', () => {
            isFullscreen = !!document.msFullscreenElement;
            updateFullscreenButton();
        });
        
        // Prevent zoom on double tap on mobile
        document.addEventListener('touchend', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
